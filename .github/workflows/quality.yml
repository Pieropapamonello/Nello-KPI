name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tests/kpi-core.test.js
      - run: node --test tests/sync.test.js
      - run: node tests/security-check.js
      - run: node --check app.js
      - run: node --check sw.js
      - run: python -m py_compile bot.py
